name: Spack Instance

# docker compose ignores 'x-' keys, but they can be used as anchors (&common-args)
# to reduce duplication in the file
x-common-args: &common-args
  OS: rocky
  SOURCE_COMPILERS_SPACK_MANIFEST: upstream/prod/compilers.spack.yaml
  SOURCE_PACKAGES_SPACK_MANIFEST: upstream/prod/packages.spack.yaml
services:
  upstream:
    container_name: Upstream
    image: ghcr.io/access-nri/build-ci-upstream:rocky-v1.1-2026.03.000
    tty: true
    build:
      context: .
      target: upstream
      args:
        <<: *common-args
        SPACK_CONFIG_DIR: /opt/spack-config/v1.1/ci-upstream
      secrets:
        - oci-username
        - oci-password
        - oci-url
    volumes:
      - upstream:/opt/upstream:rw
      - buildcache:/opt/runner_set_buildcache:rw

  runner:
    container_name: Runner
    image: ghcr.io/access-nri/build-ci-runner:rocky-v1.1-2026.03.000
    tty: true
    depends_on:
    - upstream
    build:
      context: .
      target: runner
      args:
        <<: *common-args
        SPACK_CONFIG_DIR: /opt/spack-config/v1.1/ci-runner
    volumes:
      - upstream:/opt/upstream:ro
      - buildcache:/opt/runner_set_buildcache:rw

volumes:
  upstream:
  buildcache:

secrets:
  oci-username:
    environment: BUILD_CI_BUILDCACHE_OCI_USERNAME
  oci-password:
    environment: BUILD_CI_BUILDCACHE_OCI_PASSWORD
  oci-url:
    environment: BUILD_CI_BUILDCACHE_OCI_URL
