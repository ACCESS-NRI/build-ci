name: Spack Instance

# docker compose ignores 'x-' keys, but they can be used as anchors (&common-args)
# to reduce duplication in the file
x-common-args: &common-args
  OS: rocky
  SOURCE_COMPILERS_SPACK_MANIFEST: upstream/compilers.spack.yaml
  SOURCE_PACKAGES_SPACK_MANIFEST: upstream/packages.spack.yaml
services:
  upstream:
    container_name: Upstream
    image: ghcr.io/access-nri/build-ci-upstream:${IMAGE_VERSION:-latest}
    tty: true
    build:
      context: .
      target: upstream
      args:
        <<: *common-args
      secrets:
        - oci-username
        - oci-password
        - oci-url
    volumes:
      - upstream:/opt/release:rw
      - buildcache:/opt/runner_set_buildcache:rw

  runner:
    container_name: Runner
    image: ghcr.io/access-nri/build-ci-runner:${IMAGE_VERSION:-latest}
    tty: true
    depends_on:
    - upstream
    build:
      context: .
      target: runner
      args:
        <<: *common-args
    volumes:
      - upstream:/opt/release:ro
      - buildcache:/opt/runner_set_buildcache:rw

volumes:
  upstream:
  buildcache:

secrets:
  oci-username:
    environment: BUILD_CI_BUILDCACHE_OCI_USERNAME
  oci-password:
    environment: BUILD_CI_BUILDCACHE_OCI_PASSWORD
  oci-url:
    environment: BUILD_CI_BUILDCACHE_OCI_URL
