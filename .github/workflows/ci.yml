name: CI
run-name: CI Test ${{ github.repository }} at ${{ github.event.number }} (${{ github.sha }})
on:
  workflow_call:
    inputs:
      spack-manifest-repository:
        required: false
        type: string
        default: ${{ github.repository }}
        description: |
          The repository containing the spack manifest to install.
          By default, this is the caller model component repository, which will work for most use-cases.
          For example: ACCESS-NRI/access-test-component.
      spack-manifest-repository-ref:
        required: false
        type: string
        # If the inputs.spack-manifest-repository is the same as the caller repo, use the same heuristic as inputs.ref (use the caller SHA), otherwise use the default ref
        # Unfortunately, we can't set expressions as defaults yet, so this is set in the step that checks out the manifest repository
        # default: ${{ inputs.spack-manifest-repository == github.repository && (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) || '' }}
        description: |
          The branch, tag, or commit SHA of the inputs.spack-manifest-repository to use.
          For example: main, 2025.03.0, r23ij2o3.
      spack-manifest-path:
        required: true
        type: string
        description: |
          A file path in the inputs.spack-manifest-repository that contains the spack manifest template to install.
          For example: .github/build/manifests/template/access-om2.spack.yaml.j2.
      spack-manifest-data-pairs:
        required: false
        type: string
        description: |
          An optional, multi-line string of space-separated key-value pairs to fill in inputs.spack-manifest-path.
          This is useful for filling in template values created dynamically by earlier jobs needed by this workflow.
          This doesn't include {{ ref }}, which is filled in automatically.
          For example:
          package mom5
          compiler intel
      spack-compiler-manifest-path:
        required: false
        type: string
        description: |
          A file path in the inputs.spack-manifest-repository that contains the spack manifest to install local compilers not in the upstream.
          For example: .github/build/manifests/compilers.spack.yaml.
      ref:
        required: false
        type: string
        # Since the github.sha for a pull request is the commit SHA of the merge commit (which
        # doesn't exist in the caller model component repository), we will instead use the PR HEAD SHA.
        default: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        description: |
          The branch, tag, or commit SHA of the package under test.
          This value is filled in to the inputs.spack-manifest-path template as {{ ref }}.
          For example: main, 2025.03.0, 7ey2uy2.
      spack-config-ref:
        required: false
        type: string
        default: main
        description: |
          The branch, tag, or commit SHA of the access-nri/spack-config repository to use.
          For example: main, 2025.03.0, 7ey2uy2.
      spack-ref:
        required: false
        type: string
        # Default spack version - must be changed across the Dockerfile as well
        default: access/releases/v1.1
        description: |
          The branch, tag, or commit SHA of the access-nri/spack repository to use.
          For example: develop, releases/0.22, 7ey2uy2.
      pytest-test-markers:
        required: false
        type: string
        description: |
          A string of pytest markers to use to filter tests in the caller model component repository's .github/build/tests directory.
          For example: "not slow and not mpi".
      allow-ssh-into-spack-install:
        required: false
        type: boolean
        default: false
        description: |
          Enable the actor of the workflow to SSH into the container where the spack packages have been installed.
          This is useful for gathering post-install information before the container is destroyed.
          This will also make the workflow wait until the actor SSHs into the container, or it times out, before continuing.
      container-image-version:
        required: false
        type: string
        default: :rocky
        description: |
          The version of the container image to use for the runner.
          Can be either a tag (specified by ':TAG') or a SHA (specified by '@sha256:SHA').
          For example: ':8.9' or 'rocky@sha256:1234...'.
      spack-oci-buildcache-url:
        required: false
        type: string
        description: |
          The URL to an oci-backed buildcache, available in spack >= v1.0.
          OCI-backed buildcaches are the only option for GitHub-hosted CI, and can be used as a backup for self-hosted CI's runner buildcache.
          For example: 'oci://ghcr.io/ACCESS-NRI/build-ci-buildcache'.
      run-self-hosted:
        required: false
        type: boolean
        default: true
        description: |
          Whether to run the job on a self-hosted runner.
          For security, workflow runs will hang if this is true but it is not using a valid v* branch or tag for the workflow ref.
    secrets:
      spack-install-command-pat:
        required: false
        description: |
          An optional GitHub PAT to use for the spack install command, for access to potentially private repositories.
      spack-oci-buildcache-username:
        required: false
        description: |
          A username (or GitHub username for oci://ghcr.io buildcaches) to use for reading and writing to the spack OCI buildcache, if inputs.spack-oci-buildcache-url is defined.
      spack-oci-buildcache-password:
        required: false
        description: |
          A password (or GitHub PAT for oci://ghcr.io buildcaches) to use for reading and writing to the spack OCI buildcache, if inputs.spack-oci-buildcache-url is defined.
    outputs:
      spec-concretization-graph:
        value: ${{jobs.spack-install-and-test.outputs.spec-concretization-graph }}
        description: |
          A visual representation of the dependencies and constraints of the spack manifest file installed.
      spack-manifest-repository-sha:
        value: ${{ jobs.spack-install-and-test.outputs.spack-manifest-repository-sha }}
        description: |
          The SHA of the spack manifest repository checked out.
      spack-sha:
        value: ${{ jobs.spack-install-and-test.outputs.spack-sha }}
        description: |
          The SHA of the spack repository checked out.
      spack-config-sha:
        value: ${{ jobs.spack-install-and-test.outputs.spack-config-sha }}
        description: |
          The SHA of the spack-config repository checked out.
      builtin-spack-packages-sha:
        value: ${{ jobs.spack-install-and-test.outputs.builtin-spack-packages-sha }}
        description: |
          The SHA of the builtin spack-packages repository checked out.
      access-spack-packages-sha:
        value: ${{ jobs.spack-install-and-test.outputs.access-spack-packages-sha }}
        description: |
          The SHA of the access-spack-packages repository checked out.
      caller-sha:
        value: ${{ jobs.spack-install-and-test.outputs.caller-sha }}
        description: |
          The SHA of the caller model component repository checked out.
      container-id:
        value: ${{ jobs.spack-install-and-test.outputs.container-id }}
        description: |
          The ID of the container where the spack packages have been installed.
      short-container-id:
        value: ${{ jobs.spack-install-and-test.outputs.short-container-id }}
        description: |
          The short ID of the container where the spack packages have been installed - used for artifact disambiguation.
      ## These outputs contain information on data uploaded as artifacts
      artifact-pattern:
        value: ${{ jobs.spack-install-and-test.outputs.artifact-pattern }}
        description: |
          Wildcard pattern to match all artifacts across a matrix job.
      artifact-url:
        value: ${{ jobs.spack-install-and-test.outputs.artifact-url }}
        description: |
          The URL of the artifact, which contains all outputs of the job.
          This contains spack files and outputs of the job itself for post-matrix processing.
      # test-artifact-url:
      #   value: ${{}}
      #   description: |
      #     The URL of the pytest result artifact.
jobs:
  spack-install-and-test:
    name: Install and Test
    runs-on: ${{ inputs.run-self-hosted && fromJson('{"group":"build-ci"}') || 'ubuntu-latest' }}
    container:
      image: ghcr.io/access-nri/build-ci-runner${{ inputs.container-image-version }}
      volumes:
        # For self-hosted runners, mount the proper upstream and buildcache volumes from the kubernetes cluster
        # For GitHub-hosted runners, mount the dummy volume /dev/null to avoid errors or undefined behavior, eg. fromJson('[]')
        - ${{ inputs.run-self-hosted && '/opt/upstream-v1:/opt/release:ro' || '/dev/null:/dev/null:ro' }}
        - ${{ inputs.run-self-hosted && '/opt/runner_set_buildcache:/opt/runner_set_buildcache:rw' || '/dev/null:/dev/null:ro' }}
    outputs:
      spec-concretization-graph: ${{ steps.install.outputs.spec }}
      spack-manifest-repository-sha: ${{ steps.checkout.outputs.commit }}
      spack-sha: ${{ steps.spack-update.outputs.sha }}
      spack-config-sha: ${{ steps.spack-config-update.outputs.sha }}
      builtin-spack-packages-sha: ${{ steps.install.outputs.builtin-spack-packages-sha }}
      access-spack-packages-sha: ${{ steps.install.outputs.access-spack-packages-sha }}
      caller-sha: ${{ steps.checkout-caller.outputs.commit }}
      artifact-pattern: ${{ steps.init.outputs.artifact-pattern }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      container-id: ${{ steps.init.outputs.container-id }}
      short-container-id: ${{ steps.init.outputs.short-container-id }}
      # test-artifact-url: ${{ steps.test.outputs.artifact-url }}
    env:
      # Common directory for outputs to be added to artifact
      artifact-content-dir: /tmp/artifact-output
    steps:
      - name: Init - Clone build-ci for custom actions
        uses: actions/checkout@v6
        with:
          repository: access-nri/build-ci
          ref: ${{ job.workflow_sha }}
          path: build-ci

      - name: Init - Initalize dynamic vars
        id: init
        # GitHub Actions doesn't allow expressions in the on.workflow_call.inputs.*.default section, so we need to define them here
        # Furthermore, some outputs depend on the container being started, so we define them here as well
        run: |
          # Initializing dynamic default of inputs.spack-manifest-repository-ref...

          if [[ "${{ inputs.spack-manifest-repository-ref }}" != "" ]]; then
            spack_manifest_repository_ref=${{ inputs.spack-manifest-repository-ref }}
          elif [[ "${{ inputs.spack-manifest-repository }}" == "${{ github.repository }}" ]]; then
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              spack_manifest_repository_ref=${{ github.event.pull_request.head.sha }}
            else
              spack_manifest_repository_ref=${{ github.sha }}
            fi
          fi

          echo "spack-manifest-repository-ref: $spack_manifest_repository_ref"
          echo "spack-manifest-repository-ref=$spack_manifest_repository_ref" >> $GITHUB_OUTPUT

          # Initializing container id and associated artifact globs/filenames...
          container_id=${{ job.container.id }}
          short_container_id=${container_id:0:8}

          echo "::notice::Short Container ID used for artifacts in this job: $short_container_id"

          # We can only get the job.container.id after the container is started, so we set it as the file name here
          echo "artifact-name=output-$short_container_id" >> $GITHUB_OUTPUT
          echo "artifact-pattern=output-*" >> $GITHUB_OUTPUT

          echo "container-id=$container_id" >> $GITHUB_OUTPUT
          echo "short-container-id=$short_container_id" >> $GITHUB_OUTPUT

          # Initialize artifact content directory
          mkdir -p ${{ env.artifact-content-dir }}

          # Output caller and manifest paths cloned in steps.checkout/checkout-caller for use in env-var-aware spack manifests spack.include sections
          echo "caller-repository-path=$(pwd)/caller" >> $GITHUB_OUTPUT
          echo "spack-manifest-repository-path=$(pwd)/manifest" >> $GITHUB_OUTPUT

      - name: Init - Export environment variables into GitHub Actions format
        # Environment variables inside containers are not accessible in the `env` context,
        # a context which would be used in future conditional steps.
        # This step exports important container environment variables as outputs.
        # And yes, this loop echoes name-of-var=value-of-var!
        id: env
        run: |
          for var in SPACK_ROOT INITIAL_SPACK_REPO_VERSION; do
            echo "$var=${!var}" >> $GITHUB_OUTPUT
          done

          # The upload step later requires a non-relative path, hence the realpath
          echo "spack-env-dir=$(realpath $SPACK_ROOT/../runner/environments)" >> $GITHUB_OUTPUT

      - name: Init - Disable Self-Hosted Upstreams
        if: ${{ ! inputs.run-self-hosted }}
        # For GitHub-hosted versions of build-ci, we don't have an upstream, so we disable in our user scope
        # NOTE: In future may be able to be replaced by spack config --scope=access.nri.ci.user add upstreams::{}
        run: |
          . ${{ steps.env.outputs.SPACK_ROOT }}/share/spack/setup-env.sh

          echo "--- Disable upstream ---"
          upstream_location=$(spack config --scope=access.nri.ci.user edit upstreams --print-file)
          mkdir -p $(dirname $upstream_location)
          echo "upstreams:: {}" > $upstream_location
          spack config blame upstreams

      - name: Update - spack-config version
        id: spack-config-update
        uses: ./build-ci/.github/actions/git-checkout-updated-ref
        with:
          repository-path: ${{ steps.env.outputs.SPACK_ROOT }}/../spack-config
          ref: ${{ inputs.spack-config-ref }}

      - name: Update - spack version
        id: spack-update
        uses: ./build-ci/.github/actions/git-checkout-updated-ref
        with:
          repository-path: ${{ steps.env.outputs.SPACK_ROOT }}
          ref: ${{ inputs.spack-ref }}

      - name: Update - Validate non-updated spack
        if: steps.spack-update.outputs.updated == 'false' && steps.spack-config-update.outputs.updated == 'false'
        # We don't support spack < v1.0 in build-ci@v3, so we error out if the spack version is not updated and the version in the image is < v1.0
        run: |
          if [[ "${{ steps.env.outputs.INITIAL_SPACK_REPO_VERSION }}" == "releases/v0"* ]]; then
            echo "::error::spack branch ${{ steps.env.outputs.INITIAL_SPACK_REPO_VERSION }} is not a v1.x branch, and build-ci@v3 only supports spack >= v1.0. Use build-ci@v2 for spack < v1.0"
            exit 2
          fi

      - name: Spack - Initial Enable
        run: |
          . ${{ steps.env.outputs.SPACK_ROOT }}/share/spack/setup-env.sh
          echo "----- Compilers -----"
          spack compiler list
          echo "----- Packages -----"
          spack find

      - name: Spack - Enable Runner Set Buildcache
        if: inputs.run-self-hosted
        run: |
          . ${{ steps.env.outputs.SPACK_ROOT }}/share/spack/setup-env.sh
          spack mirror add --scope=access.nri.ci.user --autopush --unsigned runner_set_buildcache /opt/runner_set_buildcache
          spack mirror list

      - name: Spack - OCI Buildcache Init
        if: inputs.spack-oci-buildcache-url != ''
        run: |
          . ${{ steps.env.outputs.SPACK_ROOT }}/share/spack/setup-env.sh
          spack mirror add --scope=access.nri.ci.user \
            --unsigned \
            --oci-username-variable OCI_USERNAME \
            --oci-password-variable OCI_PASSWORD \
            oci_buildcache ${{ inputs.spack-oci-buildcache-url }}
          spack mirror list

      - name: Manifest - Checkout Caller ${{ github.repository }}
        id: checkout-caller
        uses: actions/checkout@v6
        with:
          # The default ref is the merge commit for pull requests, which isn't able to be checked out locally
          # (and is therefore useless outside of the workflow run), so we get the PR head instead. See https://github.com/orgs/community/discussions/26325
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          path: caller

      - name: Manifest - Checkout Manifest From ${{ inputs.spack-manifest-repository }}
        id: checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.spack-manifest-repository }}
          ref: ${{ steps.init.outputs.spack-manifest-repository-ref }}
          # Only checkout the manifests, rather than the entire repository
          path: manifest
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            .github/build-ci
            ${{ inputs.spack-manifest-path }}
            ${{ inputs.spack-compiler-manifest-path }}
          # Similarly to the spack install command below, we need to be able to checkout the spack-manifest-repository (which may be private)
          token: ${{ secrets.spack-install-command-pat || github.token }}

      - name: Manifest - Delete History From ${{ inputs.spack-manifest-repository }}
        # Specifically, this is to avoid exposing a private spack manifest repository's history to the actor if they SSH in
        working-directory: manifest
        if: always() && steps.checkout.conclusion == 'success'
        run: rm -rf ./.git

      - name: Manifest - Install Compilers Locally
        # Some compilers may not be available upstream, so we install them locally in a separate spack.yaml
        if: inputs.spack-compiler-manifest-path != ''
        id: compilers
        working-directory: manifest
        env:
          # For pulling OCI buildcache
          OCI_USERNAME: ${{ secrets.spack-oci-buildcache-username || github.actor }}
          OCI_PASSWORD: ${{ secrets.spack-oci-buildcache-password || secrets.GITHUB_TOKEN }}
        run: |
          . ${{ steps.env.outputs.SPACK_ROOT }}/share/spack/setup-env.sh
          spack env activate local_compilers --create --prompt --envfile ${{ inputs.spack-compiler-manifest-path }}

          spack --debug install --fail-fast --deprecated
          spack env deactivate

          spack compiler list

      - name: Manifest - Push Local Compilers to Buildcache
        env:
          # For pulling and pushing OCI buildcache
          # If secrets.GITHUB_TOKEN has permissions.packages:write, one would not have to specify secrets.spack-oci-buildcache-password
          OCI_USERNAME: ${{ secrets.spack-oci-buildcache-username || github.actor }}
          OCI_PASSWORD: ${{ secrets.spack-oci-buildcache-password || secrets.GITHUB_TOKEN }}
        if: inputs.spack-oci-buildcache-url != '' && steps.compilers.outcome == 'success'
        run: |
          . ${{ steps.env.outputs.SPACK_ROOT }}/share/spack/setup-env.sh
          spack -e local_compilers buildcache push --unsigned --private oci_buildcache

      - name: Manifest - Install jinja-cli
        run: python3 -m pip install jinja-cli==1.2.2

      - name: Manifest - Replace jinja template variables
        # This means that the caller manifest files can remain unchanged, but still vary based on the {{ pr }}
        # Additional data can be provided to fill in the jinja template through the `spack-manifest-data-path` input
        id: jinja-templated
        working-directory: manifest
        run: |
          templated_manifest_path=$(dirname ${{ inputs.spack-manifest-path }})/templated/$(basename ${{ inputs.spack-manifest-path }} .j2)
          mkdir -p $(dirname $templated_manifest_path)

          jinja \
            --define ref ${{ inputs.ref }} \
            $( [ -n "${{ inputs.spack-manifest-data-pairs }}" ] && while read -r d; do echo "--define $d"; done <<< "${{ inputs.spack-manifest-data-pairs }}") \
            ${{ inputs.spack-manifest-path}} \
            > $templated_manifest_path

          echo "Templated manifest at $templated_manifest_path is:"
          cat $templated_manifest_path

          echo "spack-manifest-path=$templated_manifest_path" >> $GITHUB_OUTPUT

      - name: Manifest - Install
        id: install
        working-directory: manifest
        env:
          # For pulling OCI buildcache
          OCI_USERNAME: ${{ secrets.spack-oci-buildcache-username || github.actor }}
          OCI_PASSWORD: ${{ secrets.spack-oci-buildcache-password || secrets.GITHUB_TOKEN }}
          # This is needed to ensure that the spack install command can access private repositories - we replace all HTTPS git URLs with the PAT
          # We set the git config via environment variables, so that the PATs are not persisted in the container
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://oauth2:${{ secrets.spack-install-command-pat || secrets.GITHUB_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          # These environment variables are interpreted by spack manifests spack.include sections
          SPACK_MANIFEST_REPOSITORY_PATH: ${{ steps.init.outputs.spack-manifest-repository-path }}
          CALLER_REPOSITORY_PATH: ${{ steps.init.outputs.caller-repository-path }}
          # If vars.CALLER_REPOSITORY_CONFIG_PATH is set by special caller repositories (like access-spack-packages or spack-config),
          # we set env.CALLER_REPOSITORY_CONFIG_PATH to the absolute path to the callers spack config on the runner.
        run: |
          . ${{ steps.env.outputs.SPACK_ROOT }}/share/spack/setup-env.sh

          if [ -n "${{ vars.CALLER_REPOSITORY_CONFIG_PATH }}" ]; then
            echo "CALLER_REPOSITORY_CONFIG_PATH=${{ env.CALLER_REPOSITORY_PATH }}/${{ vars.CALLER_REPOSITORY_CONFIG_PATH }}" >> $GITHUB_ENV
          fi

          spack env create default ${{ steps.jinja-templated.outputs.spack-manifest-path }}
          spack env activate

          # Output config before concretization for debugging
          echo "::group::Spack Config Blame Output"
          spack config blame
          echo "::endgroup::"

          spack concretize --force

          echo "spec<<EOF" >> $GITHUB_OUTPUT
          echo "$(spack spec)" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          spack --debug install --fail-fast --deprecated

          # Output builtin and access-spack-packages-shas
          echo "access-spack-packages-sha=$(git -C $(spack location --repo access.nri) HEAD)" >> $GITHUB_OUTPUT
          echo "builtin-spack-packages-sha=$(git -C $(spack location --repo builtin) HEAD)"  >> $GITHUB_OUTPUT

      - name: Manifest - Push to Buildcache
        env:
          # For pulling and pushing OCI buildcache
          # If secrets.GITHUB_TOKEN has permissions.packages:write, one would not have to specify secrets.spack-oci-buildcache-password
          OCI_USERNAME: ${{ secrets.spack-oci-buildcache-username || github.actor }}
          OCI_PASSWORD: ${{ secrets.spack-oci-buildcache-password || secrets.GITHUB_TOKEN }}
        if: inputs.spack-oci-buildcache-url != ''
        run: |
          . ${{ steps.env.outputs.SPACK_ROOT }}/share/spack/setup-env.sh
          spack -e default buildcache push --unsigned --only=dependencies oci_buildcache

      - name: Tmate - Create session
        # Only create the session if the spack installation was attempted, and we want a tmate session
        if: >-
          always() &&
          (steps.install.conclusion == 'failure' || steps.install.conclusion == 'success') &&
          inputs.allow-ssh-into-spack-install
        id: tmate
        uses: mxschmitt/action-tmate@e5c7151931ca95bad1c6f4190c730ecf8c7dde48  # v3.19
        with:
          # sudo is not accessible in this container
          sudo: false
          # allow future steps to run without awaiting tmate session close
          detached: true
          # Only allow actor to access the tmate session
          limit-access-to-actor: true
          # Our runner container has tmate pre-installed
          install-dependencies: false

      # TODO: Add pytest infrastructure
      # - name: Run pytests
      #   id: test
      #   run: |
      #     python -m pytest -v -m "${{ inputs.pytest-test-markers }}" --junitxml=pytest.xml
      #     echo "pytest=$(cat pytest.xml)" >> $GITHUB_OUTPUT


      - name: Outputs - Consolidate Spack Outputs
        if: always() && (steps.install.conclusion == 'failure' || steps.install.conclusion == 'success')
        # Logs or manifests may not be available if the spack install failed before concretization, so we'd rather direct users to the
        # above install failure than have this step fail.
        continue-on-error: true
        run: |
          # Consolidate Manifest
          if compgen -G "${{ steps.env.outputs.spack-env-dir }}/default/spack.*" > /dev/null; then
            cp -v ${{ steps.env.outputs.spack-env-dir }}/default/spack.* ${{ env.artifact-content-dir }}
          fi

          # Consolidate Logs
          . ${{ steps.env.outputs.SPACK_ROOT }}/share/spack/setup-env.sh

          if [ ! -f ${{ steps.env.outputs.spack-env-dir }}/default/spack.lock ]; then
            echo "Spack lock file not found, skipping log creation."
            exit 0
          fi

          # Get all the top-level hashes from the manifest
          hashes="$(jq --raw-output '.roots[].hash' ${{ steps.env.outputs.spack-env-dir }}/default/spack.lock)"
          echo "Found top-level hashes:"
          echo "$hashes"

          i=0
          while read -r hash; do
            spack -e default logs /$hash > "${{ env.artifact-content-dir }}/spec_install_log_${i}.log" || true
            i=$((i + 1))
          done <<< "$hashes"

      - name: Outputs - Consolidate Job Outputs
        if: always() && (steps.install.conclusion == 'failure' || steps.install.conclusion == 'success')
        # The outputs of the job also contain the inputs to the job, so that they can be used in future jobs.
        # We need to serialize the spec concretization graph and data pairs to a single line, so that it can be used in JSON.
        run: |
          serialized_spec_concretization_graph=$(echo "${{ steps.install.outputs.spec }}" | sed -z 's/\n/\\n/g')
          serialized_spack_manifest_data_pairs=$(echo ${{ inputs.spack-manifest-data-pairs }} | sed -z 's/\n/\\n/g')

          jq --null-input \
             --arg spec "$serialized_spec_concretization_graph" \
             --arg pairs "$serialized_spack_manifest_data_pairs" \
          '{
            "spack_manifest_path": "${{ inputs.spack-manifest-path }}",
            "spack_manifest_repository": "${{ inputs.spack-manifest-repository }}",
            "spack_manifest_repository_ref": "${{ steps.init.outputs.spack-manifest-repository-ref }}",
            "spack_manifest_data_pairs": $pairs,
            "spack_compiler_manifest_path": "${{ inputs.spack-compiler-manifest-path }}",
            "ref": "${{ inputs.ref }}",
            "spack_config_ref": "${{ inputs.spack-config-ref }}",
            "spack_ref": "${{ inputs.spack-ref }}",
            "pytest_test_markers": "${{ inputs.pytest-test-markers }}",
            "allow_ssh_into_spack_install": "${{ inputs.allow-ssh-into-spack-install }}",
            "container_image_version": "${{ inputs.container-image-version }}",
            "run_self_hosted": "${{ inputs.run-self-hosted }}",

            "spack_install_result": "${{ steps.install.conclusion }}",

            "spec_concretization_graph": $spec,
            "spack_manifest_repository_sha": "${{ steps.checkout.outputs.commit }}",
            "spack_sha": "${{ steps.spack-update.outputs.sha }}",
            "spack_config_sha": "${{ steps.spack-config-update.outputs.sha }}",
            "builtin_spack_packages_sha": "${{ steps.install.outputs.builtin-spack-packages-sha }}",
            "access_spack_packages_sha": "${{ steps.install.outputs.access-spack-packages-sha }}",
            "caller_sha": "${{ steps.checkout-caller.outputs.commit }}",
            "container_id": "${{ steps.init.outputs.container-id }}",
            "short_container_id": "${{ steps.init.outputs.short-container-id }}",
            "artifact_pattern": "${{ steps.init.outputs.artifact-pattern }}"
          }' > ${{ env.artifact-content-dir }}/job_outputs.json

      - name: Outputs - Upload
        if: always() && (steps.install.conclusion == 'failure' || steps.install.conclusion == 'success')
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.init.outputs.artifact-name }}
          path: ${{ env.artifact-content-dir }}
          if-no-files-found: error
